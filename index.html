<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CALCULATOR</title>
  <link rel="stylesheet" href="Style.css ">
</head>

<body>
  <section class="calculator">
    
    <div class="screen" id="screen"></div>
    
    <div class="operators">
      
        <button class="color" id="ac">AC</button>
        <button class="color" id="bracket">()</button>
        <button class="color" id="reminder">%</button>
        <button class="a-color" id="division">/</button>
      
        <button id="seven">7</button>
        <button id="eight">8</button>
        <button id="nine">9</button>
        <button class="a-color" id="multiply">×</button>
        
        <button id="four">4</button>
        <button id="five">5</button>
        <button id="six">6</button>
        <button class="a-color" id="minus">-</button>
    
        <button id="one">1</button>
        <button id="two" onclick="click">2</button>
        <button id="three">3</button>
        <button class="a-color" id="plus">+</button>
    
        <button id="de">DE</button>
        <button id="zero">0</button>
        <button id="dot">.</button>
        <button class="a-color" id="equal">=</button>
    
    </div>
  </section>
  <script src="script.js"></script>
</body>

</html>
